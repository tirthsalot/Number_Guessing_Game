
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <button id="again-btn" class="btn">Again!</button>
    <p class="between">(Between 1 and 20)</p>

    <h1>Guess My Number!</h1>
    <div class="number-box">?</div>

    <div class="interactive-section">
      <div class="left-panel">
        <input type="number" id="guess-input" class="guess" min="1" max="20">
        <button id="check-btn" class="btn">Check!</button>
      </div>

      <div class="right-panel">
        <p class="message">Start guessing...</p>
        <p class="label-score">Score: <span class="score">20</span></p>
        <p class="label-highscore">Highscore: <span class="highscore">0</span></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
